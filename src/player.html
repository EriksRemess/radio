<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>{{TITLE}}</title>
<style>
  :root { font-family: system-ui, sans-serif; color: #cdd6f4; background: #181825; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; }
  main { width: 100%; max-width: 360px; padding: 24px; border: 1px solid #313244; border-radius: 12px; background: #1e1e2e; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { min-width: 0; font-size: 1.5rem; font-weight: 650; letter-spacing: -.04em; margin: 0; overflow-wrap: anywhere; }
  p { color: #a6adc8; font-size: .95rem; line-height: 1.5; }
  select { width: auto; max-width: 100%; padding: 6px; border: 1px solid #45475a; border-radius: 6px; background: #313244; color: inherit; font: inherit; font-size: .85rem; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin: 16px 0 0; }
  .volume-controls { display: flex; align-items: center; gap: 8px; }
  .icon-button { display: grid; place-items: center; flex: 0 0 32px; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 4px; background: transparent; color: inherit; cursor: pointer; }
  .icon-button:hover { background: #313244; }
  .icon-button svg { width: 20px; height: 20px; }
  #volume { width: 56px; margin: 0; accent-color: #a6e3a1; }
  #status { flex: 0 0 16px; text-align: center; color: #a6adc8; font-size: .85rem; line-height: 1; }
  #status[data-state="live"] { color: #a6e3a1; }
  #status[data-state="waiting"] { color: #f9e2af; }
  #status[data-state="error"] { color: #f38ba8; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
  :focus-visible { outline: 2px solid #a6e3a1; outline-offset: 3px; }
  @media (max-width: 380px) { body { padding: 16px; } main { padding: 20px; } }
</style>
<main>
  <header>
    <h1>{{TITLE}}</h1>
    <span id="status" role="status" aria-live="polite" aria-atomic="true" data-state="ready" title="Ready to listen.">
      <span id="status-glyph" aria-hidden="true">○</span><span id="status-text" class="sr-only">Ready to listen.</span>
    </span>
  </header>
  <audio id="audio" preload="none" hidden></audio>
  <div class="controls" role="group" aria-label="Live radio player">
    <button id="toggle-play" class="icon-button" type="button" aria-label="Play" title="Play">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path id="play-icon" fill="currentColor" d="M7 4v16l13-8z"/></svg>
    </button>
    <select id="format" aria-label="Audio format">{{OPTIONS}}</select>
    <div class="volume-controls">
      <button id="toggle-mute" class="icon-button" type="button" aria-label="Mute" title="Mute">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11 4 6 8H2v8h4l5 4z"/><path id="volume-icon" d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/>
        </svg>
      </button>
      <input id="volume" type="range" min="0" max="100" value="100" aria-label="Volume" title="Volume" hidden>
    </div>
  </div>
  <noscript><p>Enable JavaScript to use the player.</p></noscript>
</main>
<script>
  const audio = document.querySelector('#audio');
  const format = document.querySelector('#format');
  const status = document.querySelector('#status');
  const playButton = document.querySelector('#toggle-play');
  const muteButton = document.querySelector('#toggle-mute');
  const volume = document.querySelector('#volume');
  // iOS can accept volume assignments without changing the output level.
  const ios = /iPad|iPhone|iPod/.test(navigator.userAgent)
    || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
  if (!ios) {
    audio.volume = 0.5;
    volume.hidden = audio.volume !== 0.5;
    audio.volume = 1;
  }
  let listening = false;
  let connection = 0;
  function updateStatus(state, message) {
    status.dataset.state = state;
    status.title = message;
    document.querySelector('#status-glyph').textContent = ['live', 'waiting', 'error'].includes(state) ? '●' : '○';
    document.querySelector('#status-text').textContent = message;
  }
  function updatePlayButton() {
    const label = listening ? 'Stop' : 'Play';
    playButton.setAttribute('aria-label', label);
    playButton.title = label;
    document.querySelector('#play-icon').setAttribute('d', listening ? 'M5 5h14v14H5z' : 'M7 4v16l13-8z');
  }
  function updateVolume() {
    const muted = audio.muted || audio.volume === 0;
    const label = muted ? 'Unmute' : 'Mute';
    muteButton.setAttribute('aria-label', label);
    muteButton.title = label;
    document.querySelector('#volume-icon').setAttribute('d', muted ? 'm16 9 6 6m0-6-6 6' : 'M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14');
    volume.value = audio.muted ? 0 : Math.round(audio.volume * 100);
  }
  const supported = [...format.options].find(option => audio.canPlayType(option.dataset.type));
  if (supported) format.value = supported.value;
  function stop() {
    listening = false;
    connection++;
    audio.removeAttribute('src');
    audio.load();
    updatePlayButton();
    updateStatus('stopped', 'Stopped.');
  }
  function failed(message = 'Unable to connect. Press Play to try again or choose another format.') {
    stop();
    updateStatus('error', message);
  }
  async function connect() {
    const attempt = ++connection;
    listening = true;
    audio.src = format.value;
    audio.load();
    updatePlayButton();
    updateStatus('waiting', 'Connecting…');
    try { await audio.play(); }
    catch (error) { if (attempt === connection && error.name !== 'AbortError') failed(); }
  }
  format.addEventListener('change', () => { if (listening) connect(); });
  playButton.addEventListener('click', () => { if (listening) stop(); else connect(); });
  muteButton.addEventListener('click', () => {
    if (audio.volume === 0) { audio.volume = 1; audio.muted = false; }
    else { audio.muted = !audio.muted; }
  });
  volume.addEventListener('input', () => { audio.volume = Number(volume.value) / 100; audio.muted = false; });
  volume.addEventListener('wheel', event => {
    if (volume.hidden || event.ctrlKey || event.deltaY === 0) return;
    event.preventDefault();
    const level = audio.muted ? 0 : Math.round(audio.volume * 100);
    audio.volume = Math.max(0, Math.min(100, level - Math.sign(event.deltaY) * 5)) / 100;
    audio.muted = false;
    updateVolume();
  }, { passive: false });
  audio.addEventListener('volumechange', updateVolume);
  audio.addEventListener('playing', () => {
    if (!listening || audio.paused) return;
    updateStatus('live', 'Listening live.');
  });
  audio.addEventListener('waiting', () => { if (listening) updateStatus('waiting', 'Buffering…'); });
  audio.addEventListener('pause', () => {
    if (listening && audio.paused && !audio.ended && !audio.error) stop();
  });
  audio.addEventListener('ended', () => {
    if (!listening) return;
    failed('Stream ended. Press Play to reconnect.');
  });
  audio.addEventListener('error', () => { if (listening && audio.error) failed(); });
</script>
</html>

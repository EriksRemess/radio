# Listener and line-in capture. Values are unquoted; comments use their own line.
title = Andromeda Radio
listen = 0.0.0.0:8000
alsa_device = hw:1,0
sample_rate = 48000
channels = 2
max_clients = 128

# All three streams run continuously from the same capture.
aac_mount = /stream.aac
aac_bitrate = 256k
mp3_mount = /stream.mp3
mp3_bitrate = 192k
ogg_mount = /stream.ogg
opus_bitrate = 128k
